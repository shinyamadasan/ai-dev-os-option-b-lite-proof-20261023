name: Disposable workflow-permission escalation probe
on:
  push:
    branches: [proof/workflow-escalation]
permissions:
  contents: write
jobs:
  escalation-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test whether candidate workflow permissions defeat the read-only default
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python proof/ci_probe.py
